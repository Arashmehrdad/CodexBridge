repos:
  # The trading domain lives in its own repository. Register it like any
  # other managed repository so repo_query, run_start, and the rest of the
  # gateways can reach it. Point `path` at your own checkout: keep it a
  # sibling of the Soma checkout and the install scripts find it without
  # any absolute path in source control.
  trading-lab:
    path: "../TradingLab"
    default_tests:
      - "python -m pytest"
  stream_alpha:
    path: "D:/Github/Stream_Alpha"
    commit_mode: "explicit_only"
    allow_push: false
    refuse_unrelated_staged_files: true
    require_commit_report: true
    default_tests:
      - "python -m pytest"
    docker_compose_files:
      - "docker-compose.yml"
    docker_project_name: "stream-alpha"
    cloudflare_profiles:
      - "production"
    docker_exec_profiles:
      - command_id: "health"
        argv: ["python", "-m", "app.health"]
        timeout_seconds: 60
        description: "Run the configured in-container health command"
        writes_files: false
  second_site:
    path: "D:/Github/Second_Site"
    commit_mode: "explicit_only"
    allow_push: false
    refuse_unrelated_staged_files: true
    require_commit_report: true
    cloudflare_profiles:
      - "second_site_production"
executable_profiles:
  powershell:
    profile_id: "powershell"
    enabled: false
    executable_path: "C:/Program Files/PowerShell/7/pwsh.exe"
    target: "local"
    working_directory_policy: "arbitrary"
    environment_policy: "arbitrary"
    stdin_mode: "bytes"
    stdout_mode: "protected_artifact"
    stderr_mode: "protected_artifact"
    timeout_seconds: 600
    allow_no_timeout: true
    cancellation_policy: "process_tree"
    public_output_max_bytes: 100000
    preserve_protected_artifacts: true
    autonomy_profile: "permissive"
    unrestricted_argv: true
    unrestricted_paths: true
    unrestricted_environment: true
    unrestricted_network: true
    unrestricted_child_processes: true
  hermes_python:
    profile_id: "hermes_python"
    enabled: false
    executable_path: "D:/Github/Soma/.venv/Scripts/python.exe"
    target: "local"
    working_directory_policy: "arbitrary"
    environment_policy: "arbitrary"
    stdin_mode: "text"
    stdout_mode: "protected_artifact"
    stderr_mode: "protected_artifact"
    timeout_seconds: 600
    cancellation_policy: "process_tree"
    public_output_max_bytes: 100000
    preserve_protected_artifacts: true
    autonomy_profile: "permissive"
    unrestricted_argv: true
    unrestricted_paths: true
    unrestricted_environment: true
    unrestricted_network: true
    unrestricted_child_processes: true
parallel_execution:
  enabled: false
  autonomy_profile: "permissive"
  default_mode: "all_at_once"
  max_concurrent_powershell: null
  return_after: "launch_accepted"
  repository_lock_policy: "caller_selected"
external_fixtures:
  enabled: false
  allowed_hosts:
    - "fixtures.example.com"
  max_bytes: 20000000
  timeout_seconds: 60
docker:
  enabled: false
  executable: "docker"
  max_output_bytes: 100000
  default_timeout_seconds: 600
  allow_push: false
  allow_prune: false
  allow_remove: false
  allow_compose_down_volumes: false
  confirmation_token: "CONFIRM_DOCKER_HIGH_RISK"
cloudflare:
  enabled: false
  api_base_url: "https://api.cloudflare.com/client/v4"
  token_env: "CLOUDFLARE_API_TOKEN"
  env_file: ".env"
  timeout_seconds: 30
  max_output_bytes: 500000
  allow_dns_write: false
  allow_cache_purge: false
  allow_zone_settings: false
  allow_rulesets: false
  allow_tunnels: false
  allow_turnstile_write: false
  allow_turnstile_secret_rotation: false
  allow_turnstile_delete: false
  allow_delete: false
  confirmation_token: "CONFIRM_CLOUDFLARE_HIGH_RISK"
  profiles:
    production:
      account_id_env: "CLOUDFLARE_ACCOUNT_ID"
      zone_id_env: "CLOUDFLARE_ZONE_ID"
      zone_name: "example.com"
      allowed_dns_names:
        - "example.com"
        - "www.example.com"
      allowed_ruleset_phases:
        - "http_request_firewall_custom"
        - "http_request_transform"
      allowed_tunnel_ids: []
      allowed_turnstile_sitekeys: []
      turnstile:
        secret_destination:
          type: "env_file"
          path: ".env.production"
          variable: "TURNSTILE_SECRET_KEY"
    second_site_production:
      account_id_env: "SECOND_SITE_CLOUDFLARE_ACCOUNT_ID"
      zone_id_env: "SECOND_SITE_CLOUDFLARE_ZONE_ID"
      zone_name: "second-example.com"
      allowed_dns_names:
        - "second-example.com"
        - "www.second-example.com"
      allowed_ruleset_phases:
        - "http_request_firewall_custom"
      allowed_tunnel_ids: []
      allowed_turnstile_sitekeys: []
      turnstile:
        secret_destination:
          type: "env_file"
          path: ".env.production"
          variable: "SECOND_SITE_TURNSTILE_SECRET_KEY"
ssh:
  enabled: false
  active_autonomy_profiles:
    - "permissive"
  executable: "ssh"
  scp_executable: "scp"
  max_output_bytes: 100000
  max_transfer_bytes: 500000000
  transfer_timeout_seconds: 1800
  allow_transfer: false
  allow_deploy: false
  allow_admin: false
  allow_delete: false
  allow_reboot: false
  confirmation_token: "CONFIRM_SSH_HIGH_RISK"
  hosts:
    my_vps:
      ssh_alias: "my-vps"
      connect_timeout_seconds: 10
      use_sudo: true
      allowed_remote_roots:
        - "/srv/my-app"
        - "/var/log"
      allowed_executables:
        - "docker"
        - "git"
        - "curl"
        - "systemctl"
        - "journalctl"
      watchdog:
        enabled: false
        enforcement_mode: "observe_only"
        allow_automatic_termination: false
        poll_interval_seconds: 30
        consecutive_breaches: 2
        termination_grace_seconds: 5
        max_gpu_memory_percent: 95
        max_gpu_temperature_c: 90
        max_system_memory_percent: 95
        min_disk_free_percent: 5
      deployment_profiles:
        sample_app:
          repo_name: "stream_alpha"
          remote_root: "/srv/my-app"
          local_subdir: "."
          compose_file: "docker-compose.yml"
          compose_project_name: "sample-app"
          compose_build: true
          shared_files:
            "/srv/my-app/shared/.env.production": ".env.production"
          health_command_id: "health"
          exclude_paths:
            - "coverage"
      command_profiles:
        - command_id: "health"
          argv: ["curl", "-fsS", "http://127.0.0.1:3000/health"]
          timeout_seconds: 60
          description: "Verify the deployed application health endpoint"
          writes_remote: false
          watchdog_eligible: true
        - command_id: "uptime"
          argv: ["uptime"]
          timeout_seconds: 30
          description: "Show server uptime"
          writes_remote: false
          watchdog_eligible: false
        - command_id: "restart_app"
          argv: ["sudo", "systemctl", "restart", "my-app"]
          timeout_seconds: 60
          description: "Restart the configured application service"
          writes_remote: true
          watchdog_eligible: false
runs_dir: "runs"
# Portable Agent Skill library. The empty-root development default resolves to
# <runs_dir>/skills. For an owner-selected external private library, set
# skill_library_kind: external_private_library and provide an absolute root.
skill_library:
  skill_library_root: ""
  skill_library_kind: "runs_internal_development"
  max_files: 256
  max_total_bytes: 16777216
  max_file_bytes: 4194304
# Provider-neutral external-coder handoffs (manual use only; Soma never
# launches a coding agent).
external_coder:
  external_coder_handoff_enabled: true
  external_coder_require_policy_approval: true
gemini:
  enabled: false
# Owner-controlled Kernel-of-One capability. Disabled by default; enabling it
# requires one trusted owner/executive authority reference and activates the
# strict Company Kernel query/action authorities after the public gateway build
# is live. It does not activate a reasoning provider or scheduled autonomy.
company_kernel:
  enabled: false
  executive_authority_ref: ""
# Production repository reasoning workers. Disabled by default: enabling this
# makes the provider-neutral reasoning Task backend available, but a provider
# turn is still only started through an explicit task_action start_reasoning.
reasoning:
  enabled: false
  provider: "codex_app_server_repository"
  model: "gpt-5.6-luna"
  effort: "low"
# Shared multi-session Hermes service (H2). Disabled by default; when enabled,
# run_start operation "hermes_service" routes through one supervised,
# version-pinned persistent Hermes worker pool instead of paying the H1
# per-call companion startup cost. The fallback settings keep the H1
# one-request companion path available when the shared service is down.
hermes_service:
  enabled: false
  checkout: "D:/path/to/pinned-hermes-checkout"
  python_executable: "D:/path/to/venv/Scripts/python.exe"
  worker_count: 2
  max_output_bytes: 65536
  startup_timeout_seconds: 180
  state_path: "runs/hermes-service-state.json"
  fallback_enabled: true
  fallback_profile_id: "hermes_python"
  fallback_repo_name: ""
  # Optional provider/tool concurrency and rate limits. Tools matching no
  # pattern run fully concurrent.
  tool_limits: []
  # tool_limits:
  #   - pattern: "mcp__searchconsole__*"
  #     max_concurrent: 2
  #     min_interval_seconds: 0.0
supervisors:
  default_autonomy_profile: "permissive"
  autonomy_profiles:
    permissive:
      stop_on_requires_human: true
      max_plan_tier: 3
      max_implementation_tier: 3
      require_tests_for_non_docs_changes: false
    balanced:
      stop_on_requires_human: true
      max_plan_tier: 1
      max_implementation_tier: 2
      require_tests_for_non_docs_changes: false
    conservative:
      stop_on_requires_human: true
      max_plan_tier: 1
      max_implementation_tier: 1
      require_tests_for_non_docs_changes: true
  notifications:
    enabled: true
    max_payload_chars: 4000
    file:
      enabled: false
      path: ""
    webhook:
      enabled: false
      url_env: ""
      timeout_seconds: 5
    windows_toast:
      enabled: false
