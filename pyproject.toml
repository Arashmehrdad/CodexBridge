[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soma"
version = "0.1.0"
description = "Local Windows MCP engineering control plane for ChatGPT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastmcp",
  "pydantic",
  "pyyaml",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]
research-map = [
  "graphiti-core==0.29.3",
  "fastembed==0.8.0",
  "falkordb==1.7.1",
  "httpx==0.28.1",
]
pulse = [
  "playwright",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["soma*"]
exclude = ["runs*", "tests*"]

[tool.setuptools.package-data]
soma = ["skills/seed_packages/*/SKILL.md"]
