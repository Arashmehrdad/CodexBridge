[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codexbridge"
version = "0.1.0"
description = "Local Windows MCP bridge between ChatGPT and Codex CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastmcp",
  "pydantic",
  "pyyaml",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["codexbridge*"]
exclude = ["runs*", "tests*"]
