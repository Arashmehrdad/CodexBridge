repos:
  stream_alpha:
    path: "D:/Github/Stream_Alpha"
    default_tests:
      - "python -m pytest"
    docker_compose_files:
      - "docker-compose.yml"
    docker_project_name: "stream-alpha"
    docker_exec_profiles:
      - command_id: "health"
        argv: ["python", "-m", "app.health"]
        timeout_seconds: 60
        description: "Run the configured in-container health command"
        writes_files: false
external_fixtures:
  enabled: false
  allowed_hosts:
    - "fixtures.example.com"
  max_bytes: 20000000
  timeout_seconds: 60
docker:
  enabled: false
  executable: "docker"
  max_output_bytes: 100000
  default_timeout_seconds: 600
  allow_push: false
  allow_prune: false
  allow_remove: false
  allow_compose_down_volumes: false
  confirmation_token: "CONFIRM_DOCKER_HIGH_RISK"
ssh:
  enabled: false
  executable: "ssh"
  max_output_bytes: 100000
  hosts:
    my_vps:
      ssh_alias: "my-vps"
      connect_timeout_seconds: 10
      command_profiles:
        - command_id: "uptime"
          argv: ["uptime"]
          timeout_seconds: 30
          description: "Show server uptime"
          writes_remote: false
        - command_id: "restart_app"
          argv: ["sudo", "systemctl", "restart", "my-app"]
          timeout_seconds: 60
          description: "Restart the configured application service"
          writes_remote: true
runs_dir: "runs"
codex:
  executable: "codex"
  model: ""
  windows_sandbox: ""
  sandbox_private_desktop: null
  default_timeout_seconds: 1800
gemini:
  enabled: false
supervisors:
  default_autonomy_profile: "balanced"
  autonomy_profiles:
    balanced:
      stop_on_requires_human: true
      max_plan_tier: 1
      max_implementation_tier: 2
      require_tests_for_non_docs_changes: false
    conservative:
      stop_on_requires_human: true
      max_plan_tier: 1
      max_implementation_tier: 1
      require_tests_for_non_docs_changes: true
  notifications:
    enabled: true
    max_payload_chars: 4000
    file:
      enabled: false
      path: ""
    webhook:
      enabled: false
      url_env: ""
      timeout_seconds: 5
    windows_toast:
      enabled: false
